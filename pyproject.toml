[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pact"
version = "0.1.0"
description = "Physical and ATPG-aware co-optimization of test architectures"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
optimizer = ["numba>=0.59"]

[project.scripts]
pact-optimize = "pact.optimizer.cli:main"
pact-integrate = "pact.integration.cli:main"
pact = "pact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
